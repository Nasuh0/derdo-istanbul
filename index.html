<!DOCTYPE html>
<html lang="tr">
<style>
    /* Ses açık: dalgalar görünür, çarpı gizlenir */
    #soundControl[data-state="on"] #soundCross {
        display: none !important;
    }

    #soundControl[data-state="on"] #soundWaves {
        display: inline !important;
    }

    /* Ses kapalı veya henüz başlamamış: çarpı görünür */
    #soundControl:not([data-state="on"]) #soundCross {
        display: inline !important;
    }

    #soundControl:not([data-state="on"]) #soundWaves {
        display: none !important;
    }
</style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derdo İstanbul</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #0d0d0d;
        }

        .bg-container {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.3),
                    rgba(0, 0, 0, 0.6)
                ),
                url("https://images.unsplash.com/photo-1541432901042-2d8bd64b4a9b?q=80&w=1920&auto=format&fit=crop");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .overlay-text {
            color: #fff;
            text-align: center;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            letter-spacing: 2px;
            margin-bottom: 2rem;
        }

        .overlay-text h1 {
            font-size: 3.5rem;
            font-weight: 300;
            text-transform: uppercase;
        }

        .social-buttons {
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            color: #fff;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 500;
            transition: background 0.3s, transform 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        /* Sol alt ses kontrolü */
        .sound-control {
            position: fixed;
            left: max(20px, env(safe-area-inset-left));
            bottom: max(20px, env(safe-area-inset-bottom));
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sound-button {
            position: relative;
            display: grid;
            place-items: center;
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 1px solid currentColor;
            background: rgba(15, 15, 15, 0.8);
            backdrop-filter: blur(10px);
            color: #f4c66a;
            cursor: pointer;
            transition: color 0.25s, box-shadow 0.25s, transform 0.2s;
        }

        .sound-button:hover {
            transform: scale(1.07);
        }

        .sound-button:active {
            transform: scale(0.94);
        }

        .sound-button:focus-visible {
            outline: 2px solid white;
            outline-offset: 5px;
        }

        .sound-button svg {
            width: 24px;
            height: 24px;
        }

        .sound-control[data-state="on"] .sound-button {
            color: #73f5b0;
            box-shadow: 0 0 20px rgba(115, 245, 176, 0.25);
        }

        .sound-control[data-state="on"] .sound-button::after {
            content: "";
            position: absolute;
            inset: -1px;
            border: 1px solid #73f5b0;
            border-radius: 50%;
            pointer-events: none;
            animation: sound-pulse 1.8s ease-out infinite;
        }

        .sound-control[data-state="off"] .sound-button,
        .sound-control[data-state="error"] .sound-button {
            color: #ff8585;
            box-shadow: 0 0 15px rgba(255, 133, 133, 0.15);
        }

        .sound-label {
            padding: 8px 12px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font-size: 12px;
            backdrop-filter: blur(8px);
        }

        .sound-toast {
            position: fixed;
            left: 20px;
            bottom: calc(max(20px, env(safe-area-inset-bottom)) + 70px);
            z-index: 101;
            max-width: calc(100vw - 40px);
            padding: 12px 16px;
            color: #fff;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            backdrop-filter: blur(10px);
            font-size: 13px;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none;
        }

        .sound-toast.visible {
            opacity: 1;
            transform: translateY(0);
        }

        [hidden] {
            display: none !important;
        }

        @keyframes sound-pulse {
            from {
                transform: scale(1);
                opacity: 0.7;
            }
            to {
                transform: scale(1.45);
                opacity: 0;
            }
        }

        @media (max-width: 600px) {
            .overlay-text h1 {
                font-size: clamp(2rem, 8vw, 3.5rem);
            }

            .social-buttons {
                gap: 12px;
            }

            .social-btn {
                padding: 12px 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<style>
    /* Arka plan biraz daha karanlık */
    .bg-container::before {
        background: rgba(0, 0, 0, 0.38);
    }

    /* Aydınlanmanın üzerinde çok hafif sıcak ışık */
    .bg-container::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.45s ease;
    }

    @media (hover: hover) and (pointer: fine) {
        .bg-container.spotlight-active::before {
            background: radial-gradient(
                circle 310px at var(--mouse-x) var(--mouse-y),
                rgba(0, 0, 0, 0) 0%,
                rgba(0, 0, 0, 0.01) 12%,
                rgba(0, 0, 0, 0.05) 28%,
                rgba(0, 0, 0, 0.14) 46%,
                rgba(0, 0, 0, 0.26) 65%,
                rgba(0, 0, 0, 0.35) 84%,
                rgba(0, 0, 0, 0.38) 100%
            );
        }

        .bg-container.spotlight-active::after {
            opacity: 1;
            background:
                radial-gradient(
                    circle 130px at var(--mouse-x) var(--mouse-y),
                    rgba(255, 240, 205, 0.12) 0%,
                    rgba(255, 225, 165, 0.05) 40%,
                    transparent 100%
                ),
                radial-gradient(
                    circle 340px at var(--mouse-x) var(--mouse-y),
                    rgba(255, 218, 155, 0.04) 0%,
                    transparent 75%
                );
            mix-blend-mode: screen;
        }
    }
</style>

<body>
    <main class="bg-container">
        <div class="overlay-text">
            <h1>DERDO İSTANBUL</h1>
        </div>

        <div class="social-buttons">
            <a href="https://instagram.com"
               target="_blank"
               rel="noopener noreferrer"
               class="social-btn">
                <i class="fab fa-instagram" aria-hidden="true"></i>
                Instagram
            </a>

            <a href="https://youtube.com"
               target="_blank"
               rel="noopener noreferrer"
               class="social-btn">
                <i class="fab fa-youtube" aria-hidden="true"></i>
                YouTube
            </a>
        </div>
    </main>

    <audio id="backgroundMusic"
           src="alla-beni.mp3"
           preload="auto"
           loop
           hidden></audio>

    <div class="sound-control" id="soundControl" data-state="waiting">
        <button class="sound-button"
                id="soundButton"
                type="button"
                aria-label="Müziği başlat"
                title="Müziği başlat">
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>

                <g id="soundWaves" hidden>
                    <path d="M15 8a6 6 0 0 1 0 8"></path>
                    <path d="M18 5a10 10 0 0 1 0 14"></path>
                </g>

                <g id="soundCross">
                    <path d="m16 9 5 6m0-6-5 6"></path>
                </g>
            </svg>
        </button>

        <span class="sound-label" id="soundLabel">
            Müzik yükleniyor…
        </span>
    </div>

    <div class="sound-toast"
         id="soundToast"
         role="status"
         aria-live="polite"
         aria-atomic="true"></div>

    <script>
        (() => {
            const music = document.getElementById("backgroundMusic");
            const control = document.getElementById("soundControl");
            const button = document.getElementById("soundButton");
            const label = document.getElementById("soundLabel");
            const waves = document.getElementById("soundWaves");
            const cross = document.getElementById("soundCross");
            const toast = document.getElementById("soundToast");

            let userMuted = false;
            let waitingForInteraction = true;
            let toastTimer;
            let lastState = "";

            // Her yeni sayfa açılışında ses açık ve seviye %60.
            music.volume = 0.6;
            music.muted = false;

            function notify(message) {
                clearTimeout(toastTimer);
                toast.textContent = message;
                toast.classList.add("visible");

                toastTimer = setTimeout(() => {
                    toast.classList.remove("visible");
                }, 3000);
            }

            function render(state, showNotification = true) {
                const states = {
                    on: {
                        text: "Ses açık · %60",
                        action: "Sesi kapat",
                        message: "🔊 Ses açık · %60"
                    },
                    off: {
                        text: "Ses kapalı",
                        action: "Sesi aç",
                        message: "🔇 Ses kapalı"
                    },
                    waiting: {
                        text: "Başlatmak için sayfaya dokun",
                        action: "Müziği başlat",
                        message: "Müziğin başlaması için sayfanın herhangi bir yerine dokun."
                    },
                    loading: {
                        text: "Müzik yükleniyor…",
                        action: "Sesi kapat",
                        message: "Müzik yükleniyor…"
                    },
                    error: {
                        text: "Müzik yüklenemedi",
                        action: "Yeniden dene",
                        message: "alla-beni.mp3 dosyası yüklenemedi."
                    }
                };

                const info = states[state];
                control.dataset.state = state;
                label.textContent = info.text;
                button.title = info.action;
                button.setAttribute("aria-label", info.action);

                waves.hidden = state !== "on";
                cross.hidden = state === "on";

                if (showNotification && state !== lastState) {
                    notify(info.message);
                }

                lastState = state;
            }

            function syncState() {
                if (music.error) {
                    render("error");
                } else if (userMuted || music.muted) {
                    render("off");
                } else if (!music.paused && music.readyState >= 3) {
                    render("on");
                } else if (waitingForInteraction) {
                    render("waiting");
                } else {
                    render("loading", false);
                }
            }

            async function startMusic() {
                if (userMuted) return;

                music.muted = false;

                try {
                    await music.play();
                    waitingForInteraction = false;
                    syncState();
                } catch (error) {
                    if (userMuted) {
                        render("off");
                    } else if (error.name === "NotAllowedError") {
                        waitingForInteraction = true;
                        render("waiting");
                    } else if (error.name !== "AbortError") {
                        render("error");
                    }
                }
            }

            button.addEventListener("click", () => {
                if (music.error) {
                    userMuted = false;
                    music.load();
                    startMusic();
                    return;
                }

                if (userMuted || music.muted) {
                    userMuted = false;
                    music.muted = false;

                    if (music.paused) {
                        startMusic();
                    } else {
                        syncState();
                    }
                    return;
                }

                if (music.paused) {
                    startMusic();
                    return;
                }

                // Şarkı ilerlemeye devam eder; yalnızca ses kapanır.
                userMuted = true;
                music.muted = true;
                render("off");
            });

            function firstInteraction(event) {
                // Düğmeye basılması, sesi kapattıktan sonra tekrar açmaz.
                if (button.contains(event.target)) return;
                if (event.type === "keydown" && event.repeat) return;

                if (waitingForInteraction && !userMuted) {
                    startMusic();
                }
            }

            document.addEventListener("click", firstInteraction);
            document.addEventListener("keydown", firstInteraction);

            music.addEventListener("playing", () => {
                waitingForInteraction = false;
                syncState();
            });

            music.addEventListener("volumechange", syncState);
            music.addEventListener("pause", syncState);

            music.addEventListener("waiting", () => {
                if (!userMuted && !waitingForInteraction) {
                    render("loading", false);
                }
            });

            music.addEventListener("error", () => {
                render("error");
            });

            render("loading", false);

            // Görsellerin yüklenmesini beklemeden sesli başlatmayı dene.
            startMusic();
        })();
    </script>
ü<style>
    /* Karartma katmanı: yazıların ve butonların altında kalır. */
    .bg-container {
        isolation: isolate;
        --mouse-x: 50%;
        --mouse-y: 50%;
    }

    .bg-container::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: rgba(0, 0, 0, 0.22);
    }

    @media (hover: hover) and (pointer: fine) {
        .bg-container.spotlight-active::before {
            background: radial-gradient(
                circle 220px at var(--mouse-x) var(--mouse-y),
                transparent 0%,
                rgba(0, 0, 0, 0.04) 30%,
                rgba(0, 0, 0, 0.22) 100%
            );
        }

        html.star-cursor-active,
        html.star-cursor-active * {
            cursor: none !important;
        }
    }

    #starCursor {
        position: fixed;
        top: 0;
        left: 0;
        width: 36px;
        height: 36px;
        margin: -18px 0 0 -18px;
        z-index: 10001;
        pointer-events: none;
        display: grid;
        place-items: center;
        opacity: 0;
        border: 1px solid rgba(255, 235, 185, 0.65);
        border-radius: 50%;
        box-shadow: 0 0 14px rgba(255, 220, 140, 0.18);
    }

    #starCursor svg {
        width: 23px;
        height: 23px;
        fill: #fff3cb;
        filter: drop-shadow(0 0 5px #ffc76a);
    }

    #starTrail {
        position: fixed;
        inset: 0;
        z-index: 10000;
        pointer-events: none;
    }
</style>

<div id="starCursor" aria-hidden="true">
    <svg viewBox="0 0 24 24">
        <path d="m12 1 3 7 8 4-8 3-3 8-3-8-8-3 8-4Z"/>
    </svg>
</div>

<canvas id="starTrail" aria-hidden="true"></canvas>

<script>
(() => {
    const background = document.querySelector(".bg-container");
    const cursor = document.getElementById("starCursor");
    const canvas = document.getElementById("starTrail");
    const context = canvas.getContext("2d");

    if (!background || !context) return;

    const desktop = matchMedia("(hover: hover) and (pointer: fine)");
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

    let particles = [];
    let frame = null;
    let previous = null;
    let lastTime = 0;

    function resize() {
        const scale = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(innerWidth * scale);
        canvas.height = Math.round(innerHeight * scale);
        canvas.style.width = innerWidth + "px";
        canvas.style.height = innerHeight + "px";
        context.setTransform(scale, 0, 0, scale, 0, 0);
    }

    function drawStar(x, y, size, rotation) {
        context.save();
        context.translate(x, y);
        context.rotate(rotation);
        context.beginPath();

        for (let point = 0; point < 8; point++) {
            const angle = point * Math.PI / 4;
            const radius = point % 2 === 0 ? size : size * 0.28;
            const px = Math.cos(angle) * radius;
            const py = Math.sin(angle) * radius;

            if (point === 0) context.moveTo(px, py);
            else context.lineTo(px, py);
        }

        context.closePath();
        context.fill();
        context.restore();
    }

    function animate(time) {
        const delta = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;
        context.clearRect(0, 0, innerWidth, innerHeight);

        particles = particles.filter(particle => {
            particle.life -= delta;
            if (particle.life <= 0) return false;

            particle.x += particle.vx * delta;
            particle.y += particle.vy * delta;
            particle.rotation += delta;

            const fade = particle.life / particle.duration;
            context.globalAlpha = fade;
            context.fillStyle = "#ffe5a5";
            context.shadowColor = "#ffc76a";
            context.shadowBlur = 8;

            drawStar(
                particle.x,
                particle.y,
                particle.size * fade,
                particle.rotation
            );

            return true;
        });

        context.globalAlpha = 1;

        if (particles.length) {
            frame = requestAnimationFrame(animate);
        } else {
            frame = null;
        }
    }

    function addParticle(x, y) {
        const duration = 0.35 + Math.random() * 0.3;

        particles.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 16,
            vy: 12 + Math.random() * 18,
            size: 2 + Math.random() * 4,
            rotation: Math.random() * Math.PI,
            duration,
            life: duration
        });

        if (particles.length > 160) particles.shift();

        if (frame === null) {
            lastTime = performance.now();
            frame = requestAnimationFrame(animate);
        }
    }

    function hideEffects() {
        document.documentElement.classList.remove("star-cursor-active");
        background.classList.remove("spotlight-active");
        cursor.style.opacity = "0";
        previous = null;
        particles = [];

        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        context.clearRect(0, 0, innerWidth, innerHeight);
    }

    document.addEventListener("pointermove", event => {
        if (!desktop.matches || event.pointerType === "touch") {
            hideEffects();
            return;
        }

        const x = event.clientX;
        const y = event.clientY;
        const bounds = background.getBoundingClientRect();

        document.documentElement.classList.add("star-cursor-active");
        background.classList.add("spotlight-active");
        background.style.setProperty("--mouse-x", (x - bounds.left) + "px");
        background.style.setProperty("--mouse-y", (y - bounds.top) + "px");

        cursor.style.opacity = "1";
        cursor.style.transform = `translate3d(${x}px, ${y}px, 0)`;

        if (previous && !reducedMotion.matches) {
            const dx = x - previous.x;
            const dy = y - previous.y;
            const distance = Math.hypot(dx, dy);

            if (distance >= 3) {
                const count = Math.min(12, Math.ceil(distance / 7));

                for (let i = 1; i <= count; i++) {
                    addParticle(
                        previous.x + dx * i / count,
                        previous.y + dy * i / count
                    );
                }
            }
        }

        previous = { x, y };
    }, { passive: true });

    document.documentElement.addEventListener("pointerleave", hideEffects);
    window.addEventListener("blur", hideEffects);
    window.addEventListener("resize", resize);
    desktop.addEventListener("change", hideEffects);
    document.addEventListener("visibilitychange", () => {
        if (document.hidden) hideEffects();
    });

    resize();
})();
</script>
</body>
</html>
