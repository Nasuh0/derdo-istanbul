<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="İstanbul ilçelerini 3D keşfet.">
  <title>İSTANBUL // 3D</title>
  <link rel="stylesheet" href="/vendor/maplibre-gl.css">
  <style>
    :root{--panel:rgba(9,10,15,.80);--line:rgba(255,255,255,.16);--text:#f7f5fb;--muted:#bbb5c4;--violet:#a66cff}
    *{box-sizing:border-box}
    html,body,#map{width:100%;height:100%;margin:0}
    html,body{overflow:hidden;background:#0b0d12;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    #map{position:fixed;inset:0;background:#b9c2ca}
    .maplibregl-canvas{outline:none}
    .maplibregl-ctrl-group{background:rgba(10,10,15,.88)!important;border:1px solid var(--line)!important;box-shadow:0 8px 28px rgba(0,0,0,.22)!important}
    .maplibregl-ctrl button{filter:invert(1);opacity:.86}
    .maplibregl-ctrl-attrib{font-size:9px!important;background:rgba(255,255,255,.88)!important}
    .vignette{position:fixed;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.22),transparent 18%,transparent 78%,rgba(0,0,0,.22))}
    .topbar{position:fixed;left:18px;right:18px;top:16px;z-index:20;display:flex;justify-content:space-between;pointer-events:none}
    .brand,.mode{pointer-events:auto;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);border-radius:11px;box-shadow:0 10px 30px rgba(0,0,0,.22)}
    .brand{padding:11px 14px}.brand strong{display:block;font-size:13px;letter-spacing:.2em}.brand small{display:block;margin-top:4px;color:var(--muted);font:600 9px/1 ui-monospace,monospace;letter-spacing:.1em}
    .mode{padding:10px 12px;color:#d1cbd8;font:600 9px/1 ui-monospace,monospace;letter-spacing:.1em}.mode i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--violet);box-shadow:0 0 12px var(--violet);margin-right:7px}
    .hero{position:fixed;z-index:12;left:50%;top:14%;transform:translateX(-50%);text-align:center;pointer-events:none;transition:.35s;text-shadow:0 3px 20px rgba(0,0,0,.75)}
    .hero.hide{opacity:0;transform:translate(-50%,-10px)}.hero h1{margin:0;font-size:clamp(34px,5vw,68px);letter-spacing:.15em}.hero p{margin:7px 0 0;font-size:11px;color:#f0ebf4}
    .district-label{border:1px solid rgba(255,255,255,.32);background:rgba(12,12,17,.78);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:5px 8px;font:700 9px/1 system-ui,sans-serif;white-space:nowrap;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.28);transition:.16s;user-select:none}
    .district-label:hover,.district-label:focus{transform:scale(1.06);background:rgba(76,45,112,.92);border-color:#c7a2ff;outline:none}.district-label.major{font-size:10px;padding:6px 9px;border-color:rgba(203,166,255,.65)}
    .district-title{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:22;opacity:0;pointer-events:none;text-align:center;transition:.3s;text-shadow:0 4px 22px #000}
    .district-title.show{opacity:1}.district-title b{display:block;font-size:clamp(24px,4vw,48px);letter-spacing:.13em}.district-title span{font:600 9px/1 ui-monospace,monospace;color:#ddd4e8;letter-spacing:.13em}
    .back{position:fixed;left:18px;bottom:18px;z-index:25;display:none;border:1px solid rgba(192,149,255,.6);background:rgba(54,33,78,.88);backdrop-filter:blur(10px);color:#fff;border-radius:10px;padding:11px 13px;font-weight:750;font-size:10px;cursor:pointer}.back.show{display:block}
    .tip{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);border-radius:999px;padding:10px 14px;font-size:10px;white-space:nowrap;box-shadow:0 8px 28px rgba(0,0,0,.25);transition:.3s}.tip.hide{opacity:0;pointer-events:none;transform:translate(-50%,10px)}
    .tip i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--violet);box-shadow:0 0 12px var(--violet);margin-right:8px}
    .gesture{position:fixed;right:18px;bottom:18px;z-index:24;display:none;max-width:310px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);border-radius:11px;padding:10px 12px;color:#e7e1eb;font-size:9px;line-height:1.55}.gesture.show{display:block}
    .flash{position:fixed;inset:0;z-index:40;background:#fff;opacity:0;pointer-events:none}.flash.go{animation:flash .8s ease}@keyframes flash{0%,48%{opacity:0}58%{opacity:.14}68%{opacity:0}100%{opacity:0}}
    .fatal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;display:none;width:min(520px,88vw);padding:18px;border-radius:13px;background:rgba(24,13,17,.94);border:1px solid rgba(255,100,120,.42);text-align:center}.fatal.show{display:block}.fatal b{display:block;margin-bottom:6px}.fatal small{color:#d0c5cb;line-height:1.45}
    @media(max-width:720px){
      .topbar{left:10px;right:10px;top:10px}.brand{padding:9px 11px}.brand strong{font-size:11px}.brand small{font-size:8px}.mode{padding:9px 10px}
      .hero{top:12%}.hero h1{font-size:34px}.hero p{font-size:9px}.district-label{font-size:8px;padding:4px 6px}.district-label.major{font-size:9px}
      .tip{bottom:12px;max-width:92vw;font-size:9px}.back{left:10px;bottom:10px}.gesture{left:10px;right:10px;bottom:56px;max-width:none;text-align:center}
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>
  <div class="topbar">
    <div class="brand"><strong>İSTANBUL</strong><small>39 İLÇE // 3D</small></div>
    <div class="mode"><i></i><span id="mode">İLÇE SEÇ</span></div>
  </div>
  <div class="hero" id="hero"><h1>İSTANBUL</h1><p>İlçe adına dokun, 3D olarak yaklaş</p></div>
  <div class="district-title" id="districtTitle"><b id="districtName"></b><span>İSTANBUL // 3D GEZİNTİ</span></div>
  <button id="backBtn" class="back">← İSTANBUL'A DÖN</button>
  <div id="tip" class="tip"><i></i>Avcılar, Üsküdar, Esenyurt, Kadıköy... ilçe adına bas</div>
  <div id="gesture" class="gesture"></div>
  <div id="fatal" class="fatal"><b>Harita yüklenemedi</b><small>Harita kitaplığına erişilemedi. Sayfayı yenileyince diğer CDN otomatik olarak denenecek.</small></div>

  <script src="/vendor/maplibre-gl.js"></script>
  <script>
    const DISTRICTS=[
      ["Adalar",29.05873,40.86623],["Küçükçekmece",28.78055,41.02057],["Beşiktaş",29.02411,41.07171],["Bahçelievler",28.84540,41.00980],["Beylikdüzü",28.64749,40.98784],["Bakırköy",28.83470,40.98061],["Bayrampaşa",28.90131,41.05156],["Esenyurt",28.66122,41.04891],["Avcılar",28.71915,41.03751],["Sultangazi",28.87267,41.12071],["Başakşehir",28.74510,41.10339],["Esenler",28.86718,41.06253],["Eyüpsultan",28.87314,41.16518],["Bağcılar",28.84036,41.04499],["Arnavutköy",28.65582,41.24820],["Gaziosmanpaşa",28.90677,41.07300],["Güngören",28.87997,41.01995],["Zeytinburnu",28.90967,41.00518],["Fatih",28.95356,41.01425],["Beyoğlu",28.96740,41.04337],["Sarıyer",29.02441,41.17175],["Kağıthane",28.97886,41.08060],["Şişli",28.98895,41.06194],["Üsküdar",29.04900,41.03517],["Ümraniye",29.13753,41.02721],["Beykoz",29.21482,41.13836],["Maltepe",29.15556,40.94399],["Kadıköy",29.06308,40.98114],["Ataşehir",29.13790,40.98430],["Sancaktepe",29.27454,40.99939],["Sultanbeyli",29.27833,40.96808],["Kartal",29.19679,40.91517],["Çekmeköy",29.26996,41.07275],["Tuzla",29.35558,40.89137],["Pendik",29.36102,40.95682],["Çatalca",28.33276,41.32041],["Silivri",28.18343,41.19777],["Büyükçekmece",28.51250,41.05706],["Şile",29.63961,41.08919]
    ];
    const MAJOR=new Set(["Avcılar","Esenyurt","Küçükçekmece","Üsküdar","Kadıköy","Beşiktaş","Fatih","Beyoğlu","Şişli","Bakırköy","Beylikdüzü"]);
    const BOUNDS=[[27.78,40.72],[30.05,41.55]];
    const HOME={center:[28.98,41.08],zoom:9.35,pitch:0,bearing:0};
    let map=null,markers=[],in3D=false,initDone=false;

    function boot(){\n      if(window.maplibregl){initMap();return}\n      document.getElementById("fatal").classList.add("show");\n    }\n\n    function baseStyle(){
      return {
        version:8,
        sources:{
          osm:{
            type:"raster",
            tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
            tileSize:256,
            attribution:"© OpenStreetMap contributors"
          }
        },
        layers:[
          {id:"osm-base",type:"raster",source:"osm",minzoom:0,maxzoom:19}
        ]
      };
    }

    function initMap(){
      if(initDone)return;initDone=true;
      map=new maplibregl.Map({
        container:"map",style:baseStyle(),center:HOME.center,zoom:HOME.zoom,pitch:0,bearing:0,
        minZoom:8.5,maxZoom:19.2,maxPitch:80,maxBounds:BOUNDS,renderWorldCopies:false,
        attributionControl:true,dragPan:true,dragRotate:true,scrollZoom:true,doubleClickZoom:true,
        touchZoomRotate:true,touchPitch:true,keyboard:false,cooperativeGestures:false,
        canvasContextAttributes:{antialias:true}
      });
      map.addControl(new maplibregl.NavigationControl({visualizePitch:true,showCompass:true}),"top-right");
      addMarkersImmediately();
      map.on("load",()=>{addFree3D();document.getElementById("fatal").classList.remove("show")});
      map.on("error",e=>console.warn("Map:",e&&e.error?e.error:e));
    }

    function addMarkersImmediately(){
      for(const [name,lng,lat] of DISTRICTS){
        const el=document.createElement("button");el.type="button";
        el.className="district-label"+(MAJOR.has(name)?" major":"");el.textContent=name;
        el.addEventListener("click",ev=>{ev.preventDefault();ev.stopPropagation();enterDistrict(name,lng,lat)});
        markers.push(new maplibregl.Marker({element:el,anchor:"center"}).setLngLat([lng,lat]).addTo(map));
      }
    }

    function addFree3D(){
      try{
        if(map.getSource("ofm3d"))return;
        map.addSource("ofm3d",{type:"vector",url:"https://tiles.openfreemap.org/planet"});
        map.addLayer({
          id:"buildings3d",type:"fill-extrusion",source:"ofm3d","source-layer":"building",minzoom:14,
          paint:{
            "fill-extrusion-color":["interpolate",["linear"],["coalesce",["get","render_height"],["get","height"],0],0,"#d8d5dc",30,"#c6becb",80,"#ac9bb9",180,"#896ea1"],
            "fill-extrusion-height":["interpolate",["linear"],["zoom"],14,0,15,["coalesce",["get","render_height"],["get","height"],8]],
            "fill-extrusion-base":["coalesce",["get","render_min_height"],["get","min_height"],0],
            "fill-extrusion-opacity":.95
          }
        });
      }catch(e){console.warn("3D katman eklenemedi",e)}
    }

    const hero=document.getElementById("hero"),title=document.getElementById("districtTitle"),nameBox=document.getElementById("districtName");
    const back=document.getElementById("backBtn"),tip=document.getElementById("tip"),mode=document.getElementById("mode"),gesture=document.getElementById("gesture"),flash=document.getElementById("flash");

    function setMarkers(show){for(const m of markers)m.getElement().style.display=show?"block":"none"}

    function enterDistrict(name,lng,lat){
      if(!map||in3D)return;in3D=true;setMarkers(false);
      hero.classList.add("hide");tip.classList.add("hide");back.classList.add("show");title.classList.add("show");
      nameBox.textContent=name.toUpperCase();mode.textContent="3D GEZİNTİ";
      gesture.classList.add("show");
      gesture.textContent=matchMedia("(pointer:coarse)").matches
        ?"Tek parmak: haritada gez • İki parmak: döndür/eğ • Sıkıştır: yakınlaş/uzaklaş"
        :"Sol tuş + sürükle: haritada gez • Sağ tuş + sürükle: sağa-sola bak/eğ • Tekerlek: yakınlaş/uzaklaş";
      flash.classList.remove("go");void flash.offsetWidth;flash.classList.add("go");
      map.flyTo({center:[lng,lat],zoom:16.4,pitch:68,bearing:22,duration:3400,curve:1.42,speed:.85,essential:true});
    }

    function goHome(){
      if(!map)return;in3D=false;title.classList.remove("show");back.classList.remove("show");gesture.classList.remove("show");
      hero.classList.remove("hide");tip.classList.remove("hide");mode.textContent="İLÇE SEÇ";
      map.flyTo({center:HOME.center,zoom:HOME.zoom,pitch:0,bearing:0,duration:1700,essential:true});
      setTimeout(()=>setMarkers(true),850);
    }
    back.addEventListener("click",goHome);

    boot();
  </script>
</body>
</html>
