<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derdo İstanbul</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .bg-container {
            width: 100%;
            height: 100%;
            background: url('alla-beni.mp3') no-repeat center center; /* İsteğe göre arka plan görseli eklenebilir veya siyah kalabilir */
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Sol alt köşe müzik kontrol butonu */
        .music-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 14px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .music-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="bg-container"></div>

    <!-- Gizli Müzik Çalar -->
    <audio id="bgMusic" src="alla-beni.mp3" loop preload="auto"></audio>

    <!-- Sol Alt Müzik Kontrol Tuşu -->
    <button class="music-btn" id="musicToggleBtn" onclick="toggleMusic()">
        <span id="icon">🔇</span> <span id="btnText">Müziği Başlat</span>
    </button>

    <script>
        const music = document.getElementById('bgMusic');
        const btnText = document.getElementById('btnText');
        const icon = document.getElementById('icon');
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                icon.textContent = '🔇';
                btnText.textContent = 'Müziği Aç';
                isPlaying = false;
            } else {
                music.play().then(() => {
                    icon.textContent = '🔊';
                    btnText.textContent = 'Müziği Kapat';
                    isPlaying = true;
                }).catch(e => {
                    console.log("Oynatma hatası:", e);
                });
            }
        }

        // Sayfada herhangi bir yere ilk tıklamada otomatik başlatma (Tarayıcı engellerini aşmak için)
        document.body.addEventListener('click', function initAutoPlay() {
            if (!isPlaying) {
                music.play().then(() => {
                    icon.textContent = '🔊';
                    btnText.textContent = 'Müziği Kapat';
                    isPlaying = true;
                }).catch(e => {});
            }
        }, { once: true });
    </script>

</body>
</html>
