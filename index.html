<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Derdo İstanbul</title>
<link rel="stylesheet" href="derdo.css">
<script src="derdo.js" integrity="sha384-l/MuTVDSil/TXz7YC3dsav5+Od3fDLktdCG4vMEu8+DnnjnAtnVCIRq0b87WEw4Q" defer></script>
</head>
<body>
    <main class="bg-container">
        <div class="overlay-text">
            <h1>DERDO İSTANBUL</h1>
        </div>

        <div class="social-buttons">
            <a href="https://instagram.com"
               target="_blank"
               rel="noopener noreferrer"
               class="social-btn">
                <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
                Instagram
            </a>

            <a href="https://youtube.com"
               target="_blank"
               rel="noopener noreferrer"
               class="social-btn">
                <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="5" fill="currentColor"/><path d="m10 8 6 4-6 4Z" fill="#17202a"/></svg>
                YouTube
            </a>
        </div>
    </main>

    <audio id="backgroundMusic"
           src="alla-beni.mp3"
           preload="auto"
           loop
           hidden></audio>

    <div class="sound-control" id="soundControl" data-state="waiting">
        <button class="sound-button"
                id="soundButton"
                type="button"
                aria-label="Müziği başlat"
                title="Müziği başlat">
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M11 5 6 9H3v6h3l5 4V5Z"></path>

                <g id="soundWaves" hidden>
                    <path d="M15 8a6 6 0 0 1 0 8"></path>
                    <path d="M18 5a10 10 0 0 1 0 14"></path>
                </g>

                <g id="soundCross">
                    <path d="m16 9 5 6m0-6-5 6"></path>
                </g>
            </svg>
        </button>

        <span class="sound-label" id="soundLabel">
            Müzik yükleniyor…
        </span>
    </div>

    <div class="sound-toast"
         id="soundToast"
         role="status"
         aria-live="polite"
         aria-atomic="true"></div>

    
<div id="starCursor" aria-hidden="true">
    <svg viewBox="0 0 24 24">
        <path d="m12 1 3 7 8 4-8 3-3 8-3-8-8-3 8-4Z"/>
    </svg>
</div>

<canvas id="starTrail" aria-hidden="true"></canvas>










</body>
</html>
