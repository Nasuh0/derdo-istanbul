<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#050507">
  <meta name="description" content="İstanbul'u 3D keşfet. Haritada bir noktaya dokun ve şehre sinematik şekilde yaklaş.">
  <title>İSTANBUL // 3D</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.css">
  <style>
    :root{
      --bg:#050507;
      --panel:rgba(8,8,12,.72);
      --line:rgba(255,255,255,.13);
      --text:#f3f2f7;
      --muted:#9b98a6;
      --violet:#9c6cff;
      --violet2:#5f42b8;
    }
    *{box-sizing:border-box}
    html,body,#map{width:100%;height:100%;margin:0}
    html,body{overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{position:relative}
    #map{position:fixed;inset:0;background:#050507}
    .maplibregl-canvas{outline:none}
    .maplibregl-ctrl-bottom-right{right:8px;bottom:5px}
    .maplibregl-ctrl-attrib{background:rgba(5,5,7,.58)!important;color:#aaa!important;font-size:9px!important}
    .maplibregl-ctrl-attrib a{color:#bbb!important}
    .maplibregl-ctrl-group{background:rgba(8,8,12,.72)!important;border:1px solid var(--line);box-shadow:none!important}
    .maplibregl-ctrl button{filter:invert(1);opacity:.72}

    .vignette,.scan,.flash,.target-ring,.hud,.city-title,.hint,.coords,.loading,.cinema-bars{pointer-events:none;position:fixed;z-index:10}
    .vignette{inset:0;background:
      radial-gradient(circle at 50% 45%,transparent 35%,rgba(0,0,0,.26) 70%,rgba(0,0,0,.72) 110%),
      linear-gradient(180deg,rgba(0,0,0,.18),transparent 18%,transparent 80%,rgba(0,0,0,.28));
      z-index:3
    }
    .scan{inset:0;opacity:.12;background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(255,255,255,.025) 4px);z-index:4}
    .city-title{left:34px;top:28px;display:flex;align-items:center;gap:13px;z-index:12}
    .city-title .mark{width:11px;height:11px;border:2px solid var(--violet);transform:rotate(45deg);box-shadow:0 0 18px rgba(156,108,255,.5)}
    .city-title strong{font-size:14px;letter-spacing:.24em;font-weight:750}
    .city-title small{display:block;margin-top:3px;color:var(--muted);font:500 9px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.16em}
    .hud{right:28px;top:27px;display:flex;gap:8px;z-index:12}
    .hud span{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);padding:9px 11px;color:#aaa7b2;font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.11em}
    .hud b{color:#d9d5e0;font-weight:650}
    .hint{left:50%;bottom:34px;transform:translateX(-50%);z-index:12;text-align:center;transition:.3s}
    .hint .pill{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);background:rgba(8,8,12,.76);backdrop-filter:blur(14px);padding:11px 15px;border-radius:999px;font-size:11px;letter-spacing:.05em;box-shadow:0 10px 35px rgba(0,0,0,.25)}
    .hint .dot{width:6px;height:6px;background:var(--violet);border-radius:50%;box-shadow:0 0 14px rgba(156,108,255,.9);animation:pulse 1.7s ease-in-out infinite}
    .hint small{display:block;color:#777481;font:500 9px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;margin-top:8px;letter-spacing:.07em}
    @keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
    .coords{left:30px;bottom:28px;color:#777481;font:500 9px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;z-index:12}
    .coords b{color:#bdb9c5;font-weight:550}
    .target-ring{width:56px;height:56px;border:1px solid rgba(156,108,255,.9);border-radius:50%;transform:translate(-50%,-50%) scale(.4);opacity:0;box-shadow:0 0 0 9px rgba(156,108,255,.06),0 0 45px rgba(156,108,255,.25);z-index:13}
    .target-ring:before,.target-ring:after{content:"";position:absolute;background:rgba(199,176,255,.9)}
    .target-ring:before{width:1px;height:76px;left:27px;top:-11px}
    .target-ring:after{height:1px;width:76px;top:27px;left:-11px}
    .target-ring.show{animation:lock .65s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes lock{0%{opacity:0;transform:translate(-50%,-50%) scale(1.7) rotate(18deg)}70%{opacity:1}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
    .flash{inset:0;background:white;opacity:0;z-index:20}
    body.cinematic .flash{animation:flash 1.15s ease-out}
    @keyframes flash{0%,58%{opacity:0}64%{opacity:.18}68%{opacity:0}74%{opacity:.08}100%{opacity:0}}
    .cinema-bars{inset:0;z-index:11}
    .cinema-bars:before,.cinema-bars:after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .38s ease}
    .cinema-bars:before{top:0}.cinema-bars:after{bottom:0}
    body.cinematic .cinema-bars:before,body.cinematic .cinema-bars:after{height:3.8vh}
    body.cinematic .hint{opacity:0;transform:translate(-50%,12px)}
    .speed-lines{position:fixed;inset:-25%;z-index:5;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.06) 0deg,transparent .6deg,transparent 5deg);transform:scale(.55);filter:blur(1px);mask-image:radial-gradient(circle,transparent 0 17%,#000 43%,transparent 73%)}
    body.diving .speed-lines{animation:diveLines 2.1s cubic-bezier(.18,.82,.22,1)}
    @keyframes diveLines{0%{opacity:0;transform:scale(.55) rotate(0)}15%{opacity:.23}75%{opacity:.09}100%{opacity:0;transform:scale(1.42) rotate(5deg)}}
    .loading{inset:0;display:grid;place-items:center;background:#050507;z-index:30;transition:opacity .7s ease,visibility .7s}
    .loading.hide{opacity:0;visibility:hidden}
    .loader{text-align:center}
    .loader-ring{width:40px;height:40px;margin:0 auto 16px;border:1px solid #24212d;border-top-color:var(--violet);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loader strong{font-size:12px;letter-spacing:.22em}
    .loader small{display:block;color:#6f6c78;font:500 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;margin-top:8px;letter-spacing:.1em}
    .place-label{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:15;opacity:0;pointer-events:none;text-align:center;text-shadow:0 3px 20px #000;transition:opacity .3s}
    .place-label.show{opacity:1}
    .place-label b{display:block;font-size:clamp(22px,3vw,42px);letter-spacing:.13em;text-transform:uppercase}
    .place-label small{color:#a7a2ae;font:500 10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.14em}
    @media(max-width:700px){
      .city-title{left:17px;top:18px}.city-title strong{font-size:12px}
      .hud{right:14px;top:14px}.hud span:nth-child(2){display:none}
      .coords{left:17px;bottom:20px}.hint{bottom:56px;width:calc(100% - 34px)}
      .hint .pill{font-size:10px}.maplibregl-ctrl-top-right{top:52px}
    }
  </style>
</head>
<body>
  <div id="map" aria-label="3D İstanbul haritası"></div>
  <div class="vignette"></div>
  <div class="scan"></div>
  <div class="speed-lines"></div>
  <div class="flash"></div>
  <div class="cinema-bars"></div>

  <div class="city-title">
    <span class="mark"></span>
    <div><strong>İSTANBUL</strong><small>INTERACTIVE 3D CITY</small></div>
  </div>

  <div class="hud">
    <span>MODE <b>3D</b></span>
    <span>SECTOR <b>IST</b></span>
  </div>

  <div class="hint">
    <div class="pill"><i class="dot"></i> Haritada bir noktaya tıkla</div>
    <small>ŞEHRE SİNEMATİK İNİŞ</small>
  </div>

  <div class="coords">LAT <b id="lat">41.0082</b><br>LNG <b id="lng">28.9784</b></div>
  <div class="target-ring" id="targetRing"></div>
  <div class="place-label" id="placeLabel"><b>HEDEF KİLİTLENDİ</b><small id="placeCoords"></small></div>

  <div class="loading" id="loading">
    <div class="loader">
      <div class="loader-ring"></div>
      <strong>İSTANBUL</strong>
      <small>3D CITY INITIALIZING</small>
    </div>
  </div>

  <script type="module">
    import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.mjs';

    const ISTANBUL_BOUNDS = [[27.78,40.72],[30.05,41.55]];
    const ISTANBUL_CENTER = [28.9784,41.0082];

    const map = new maplibregl.Map({
      container:'map',
      style:'https://tiles.openfreemap.org/styles/dark',
      center:ISTANBUL_CENTER,
      zoom:10.55,
      pitch:48,
      bearing:-18,
      minZoom:9.15,
      maxZoom:19.2,
      maxBounds:ISTANBUL_BOUNDS,
      canvasContextAttributes:{antialias:true},
      attributionControl:false,
      cooperativeGestures:false
    });

    map.addControl(new maplibregl.NavigationControl({visualizePitch:true,showCompass:true}), 'top-right');
    map.addControl(new maplibregl.AttributionControl({compact:true}), 'bottom-right');

    const loading = document.getElementById('loading');
    const lat = document.getElementById('lat');
    const lng = document.getElementById('lng');
    const targetRing = document.getElementById('targetRing');
    const placeLabel = document.getElementById('placeLabel');
    const placeCoords = document.getElementById('placeCoords');

    let diving = false;
    let fallbackTried = false;

    function addBuildings(){
      if(map.getLayer('istanbul-3d-buildings')) return;
      const layers = map.getStyle().layers || [];
      const labelLayer = layers.find(l => l.type === 'symbol' && l.layout && l.layout['text-field']);
      if(!map.getSource('openfreemap-3d')){
        map.addSource('openfreemap-3d',{
          type:'vector',
          url:'https://tiles.openfreemap.org/planet'
        });
      }
      map.addLayer({
        id:'istanbul-3d-buildings',
        source:'openfreemap-3d',
        'source-layer':'building',
        type:'fill-extrusion',
        minzoom:14.2,
        filter:['!=',['get','hide_3d'],true],
        paint:{
          'fill-extrusion-color':[
            'interpolate',['linear'],['coalesce',['get','render_height'],0],
            0,'#16151b',
            35,'#211d2a',
            90,'#30253d',
            200,'#49376a'
          ],
          'fill-extrusion-height':[
            'interpolate',['linear'],['zoom'],
            14.2,0,
            15.2,['coalesce',['get','render_height'],['get','height'],8]
          ],
          'fill-extrusion-base':['coalesce',['get','render_min_height'],['get','min_height'],0],
          'fill-extrusion-opacity':0.88,
          'fill-extrusion-vertical-gradient':true
        }
      }, labelLayer ? labelLayer.id : undefined);
    }

    map.on('load',()=>{
      addBuildings();
      map.setLight({
        anchor:'viewport',
        color:'#c8b8ff',
        intensity:0.33,
        position:[1.4,210,35]
      });
      setTimeout(()=>loading.classList.add('hide'),450);
      setTimeout(()=>{
        map.easeTo({pitch:57,bearing:-12,zoom:10.8,duration:2200,easing:t=>1-Math.pow(1-t,3)});
      },650);
    });

    map.on('error',e=>{
      const msg = String(e?.error?.message || '');
      if(!fallbackTried && (msg.includes('style') || msg.includes('404'))){
        fallbackTried = true;
        map.setStyle('https://tiles.openfreemap.org/styles/fiord');
        map.once('styledata',()=>{ try{addBuildings()}catch(_){} });
      }
    });

    map.on('mousemove',e=>{
      lat.textContent=e.lngLat.lat.toFixed(5);
      lng.textContent=e.lngLat.lng.toFixed(5);
    });

    function setRing(point){
      targetRing.style.left=point.x+'px';
      targetRing.style.top=point.y+'px';
      targetRing.classList.remove('show');
      void targetRing.offsetWidth;
      targetRing.classList.add('show');
    }

    function cinematicDive(lngLat, point){
      if(diving) return;
      diving=true;
      setRing(point);
      placeCoords.textContent = lngLat.lat.toFixed(5)+' / '+lngLat.lng.toFixed(5);
      placeLabel.classList.add('show');
      document.body.classList.add('cinematic');

      map.dragPan.disable();
      map.scrollZoom.disable();
      map.doubleClickZoom.disable();
      map.touchZoomRotate.disable();

      const currentBearing = map.getBearing();
      const skyBearing = currentBearing + 12;
      const finalBearing = currentBearing + 28;

      map.easeTo({
        center:[lngLat.lng,lngLat.lat],
        zoom:9.55,
        pitch:0,
        bearing:skyBearing,
        duration:900,
        easing:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2
      });

      setTimeout(()=>{
        document.body.classList.add('diving');
        placeLabel.classList.remove('show');

        map.flyTo({
          center:[lngLat.lng,lngLat.lat],
          zoom:17.25,
          pitch:68,
          bearing:finalBearing,
          duration:3100,
          curve:1.55,
          speed:0.85,
          essential:true
        });
      },850);

      setTimeout(()=>{
        document.body.classList.remove('cinematic','diving');
        targetRing.classList.remove('show');
        map.dragPan.enable();
        map.scrollZoom.enable();
        map.doubleClickZoom.enable();
        map.touchZoomRotate.enable();
        diving=false;
      },4100);
    }

    map.on('click',e=>cinematicDive(e.lngLat,e.point));

    window.addEventListener('keydown',e=>{
      if(e.key.toLowerCase()==='r' && !diving){
        map.flyTo({center:ISTANBUL_CENTER,zoom:10.7,pitch:55,bearing:-12,duration:1800});
      }
    });
  </script>
</body>
</html>
