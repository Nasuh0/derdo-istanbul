<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#040407">
  <title>İSTANBUL // 3D</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.css">
  <style>
    :root{--bg:#040407;--text:#f6f3ff;--muted:#8c8798;--violet:#a873ff;--line:rgba(255,255,255,.13)}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    #fallbackMap,#google3d{position:fixed;inset:0;width:100%;height:100%;background:#050507}
    #google3d{display:none}
    #fallbackMap{display:block}
    .shade{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at 50% 44%,transparent 25%,rgba(0,0,0,.24) 62%,rgba(0,0,0,.76) 110%)}
    .hud{position:fixed;z-index:20;left:24px;top:22px;font:600 10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.16em;color:#aaa5b5}
    .hud b{color:#eee9f6}
    .badge{position:fixed;right:24px;top:22px;z-index:20;border:1px solid var(--line);background:rgba(5,5,8,.66);backdrop-filter:blur(12px);padding:9px 11px;font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.12em;color:#b7b1c1}
    .badge i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--violet);margin-right:7px;box-shadow:0 0 12px var(--violet)}
    .intro{position:fixed;inset:0;z-index:50;background:#040407;display:grid;place-items:center;transition:opacity .85s ease,visibility .85s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
    .intro.leave{opacity:0;visibility:hidden;transform:scale(1.22)}
    .intro:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 52%,rgba(111,64,183,.16),transparent 43%),repeating-linear-gradient(180deg,transparent 0 3px,rgba(255,255,255,.018) 4px);pointer-events:none}
    .city-wrap{position:relative;width:min(1120px,94vw);height:min(520px,72vh);display:grid;place-items:center}
    .eyebrow{position:absolute;top:4%;left:50%;transform:translateX(-50%);color:#767181;font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.28em;white-space:nowrap}
    .istanbul-svg{width:100%;height:100%;filter:drop-shadow(0 0 34px rgba(151,92,255,.12));overflow:visible}
    .land{fill:#0e0d14;stroke:#8a5de1;stroke-width:1.4;vector-effect:non-scaling-stroke;transition:.25s;cursor:crosshair}
    .land:hover{fill:#13101c;stroke:#b286ff}
    .district{fill:none;stroke:rgba(176,137,255,.24);stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
    .coastglow{fill:none;stroke:rgba(188,147,255,.15);stroke-width:12;filter:blur(10px);pointer-events:none}
    .waterline{fill:none;stroke:rgba(255,255,255,.08);stroke-width:1;stroke-dasharray:4 8;pointer-events:none}
    .city-name{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;text-shadow:0 4px 28px #000}
    .city-name strong{font-size:clamp(38px,8vw,104px);letter-spacing:.16em;font-weight:750}
    .city-name small{display:block;margin-top:10px;color:#8d8796;font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.28em}
    .help{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);pointer-events:none;text-align:center;color:#aaa5b3;font-size:11px;letter-spacing:.04em}
    .help span{display:inline-flex;align-items:center;gap:9px;padding:11px 15px;border:1px solid var(--line);border-radius:999px;background:rgba(9,8,13,.72);backdrop-filter:blur(12px)}
    .help i{width:6px;height:6px;background:var(--violet);border-radius:50%;box-shadow:0 0 16px var(--violet);animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
    .target{position:fixed;z-index:70;width:74px;height:74px;border:1px solid #ad7aff;border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(1.7)}
    .target:before,.target:after{content:"";position:absolute;background:#cab0ff}.target:before{left:36px;top:-14px;width:1px;height:100px}.target:after{top:36px;left:-14px;height:1px;width:100px}
    .target.show{animation:lock .65s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes lock{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    .flash{position:fixed;inset:0;z-index:65;background:#fff;pointer-events:none;opacity:0}
    .flash.go{animation:flash .95s ease}
    @keyframes flash{0%,48%{opacity:0}58%{opacity:.2}68%{opacity:0}76%{opacity:.07}100%{opacity:0}}
    .status{position:fixed;z-index:25;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 12px;background:rgba(5,5,8,.68);border:1px solid var(--line);backdrop-filter:blur(10px);font:600 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:#938d9e;letter-spacing:.08em;opacity:0;transition:.25s;pointer-events:none}
    .status.show{opacity:1}
    @media(max-width:700px){.hud{left:14px;top:14px}.badge{right:14px;top:14px}.city-wrap{height:60vh;width:96vw}.city-name strong{letter-spacing:.1em}.help{bottom:1%}}
  </style>
</head>
<body>
  <div id="fallbackMap"></div>
  <div id="google3d"></div>
  <div class="shade"></div>
  <div class="hud">CITY <b>İSTANBUL</b><br>MODE <b id="modeText">READY</b></div>
  <div class="badge"><i></i><span id="engineLabel">3D ENGINE</span></div>
  <div class="status" id="status"></div>
  <div class="flash" id="flash"></div>
  <div class="target" id="target"></div>

  <section class="intro" id="intro">
    <div class="city-wrap" id="cityWrap">
      <div class="eyebrow">SELECT A POINT // ISTANBUL ONLY</div>
      <svg class="istanbul-svg" viewBox="0 0 1200 500" aria-label="İstanbul silueti">
        <path class="coastglow" d="M70 286 C145 244 224 220 305 231 C382 241 425 209 506 218 C561 224 604 202 650 181 C701 158 744 173 776 194 C820 222 865 213 916 206 C1001 195 1070 215 1132 250"/>
        <path class="land" id="istanbulLand" d="M51 305
          C89 266 132 243 183 232 C229 222 269 226 305 238
          C344 251 380 244 413 225 C449 204 492 207 527 222
          C555 234 576 229 603 211 C626 195 645 168 674 158
          C707 147 735 164 755 190 C775 216 797 223 828 218
          C876 210 926 195 976 202 C1026 208 1082 222 1150 252
          L1125 283 C1064 264 1012 260 963 267 C904 276 857 292 810 289
          C767 286 733 269 699 250 C673 236 651 237 625 250
          C593 267 572 288 542 296 C505 306 468 298 431 285
          C393 272 358 271 323 283 C282 297 245 311 202 313
          C152 315 102 312 51 305 Z"/>
        <path class="land" d="M706 298 C746 292 776 300 804 319 C831 337 855 337 886 327 C922 315 952 318 981 337 C1007 354 1040 359 1075 354 C1057 380 1027 395 991 398 C956 401 930 386 901 376 C872 365 847 368 819 380 C786 393 754 386 733 367 C714 349 704 324 706 298 Z"/>
        <path class="district" d="M173 235 L198 312 M267 228 L284 297 M351 247 L367 274 M430 218 L447 290 M518 221 L532 295 M602 211 L614 254 M675 158 L691 249 M756 191 L748 274 M833 217 L843 287 M920 205 L925 276 M1014 208 L1006 267"/>
        <path class="district" d="M725 302 L757 385 M789 311 L810 382 M853 334 L866 374 M922 323 L935 387 M987 340 L992 396"/>
        <path class="waterline" d="M661 161 C648 191 650 222 664 249 C677 273 692 294 706 317"/>
      </svg>
      <div class="city-name"><strong>İSTANBUL</strong><small>EUROPE × ASIA // 3D CITY</small></div>
      <div class="help"><span><i></i> İstanbul üzerinde istediğin noktaya dokun</span></div>
    </div>
  </section>

  <script src="https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.js"></script>
  <script>
    const IST = {west:27.78,east:30.05,south:40.72,north:41.55};
    const intro = document.getElementById('intro');
    const cityWrap = document.getElementById('cityWrap');
    const target = document.getElementById('target');
    const flash = document.getElementById('flash');
    const statusEl = document.getElementById('status');
    const modeText = document.getElementById('modeText');
    const engineLabel = document.getElementById('engineLabel');
    let map, selected = {lat:41.0082,lng:28.9784}, busy=false;

    function status(t){statusEl.textContent=t;statusEl.classList.add('show');setTimeout(()=>statusEl.classList.remove('show'),2600)}
    function clickToLngLat(e){
      const r=cityWrap.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
      return {lng:IST.west+x*(IST.east-IST.west),lat:IST.north-y*(IST.north-IST.south)};
    }
    function lockAt(e){
      target.style.left=e.clientX+'px';target.style.top=e.clientY+'px';
      target.classList.remove('show');void target.offsetWidth;target.classList.add('show');
    }

    cityWrap.addEventListener('click',async e=>{
      if(busy) return;
      const land=e.target.closest && e.target.closest('.land');
      if(!land) return;
      busy=true; selected=clickToLngLat(e); lockAt(e);
      modeText.textContent='LOCKED';
      setTimeout(()=>{flash.classList.add('go');intro.classList.add('leave')},420);
      setTimeout(async()=>{
        target.classList.remove('show');
        startFallbackDive(selected)
      },850);
    });

    function initFallback(){
      map=new maplibregl.Map({
        container:'fallbackMap',
        style:'https://tiles.openfreemap.org/styles/dark',
        center:[28.9784,41.0082],
        zoom:10.4,pitch:54,bearing:-14,
        minZoom:9.1,maxZoom:19.5,
        maxBounds:[[IST.west,IST.south],[IST.east,IST.north]],
        renderWorldCopies:false,
        attributionControl:false
      });
      map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
      map.on('load',()=>{
        try{
          const layers=map.getStyle().layers||[];
          const label=layers.find(l=>l.type==='symbol'&&l.layout&&l.layout['text-field']);
          map.addSource('b3d',{type:'vector',url:'https://tiles.openfreemap.org/planet'});
          map.addLayer({
            id:'istanbul-3d',source:'b3d','source-layer':'building',type:'fill-extrusion',minzoom:14,
            paint:{
              'fill-extrusion-color':['interpolate',['linear'],['coalesce',['get','render_height'],0],0,'#15131a',45,'#272030',120,'#4b3767'],
              'fill-extrusion-height':['interpolate',['linear'],['zoom'],14,0,15,['coalesce',['get','render_height'],['get','height'],8]],
              'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
              'fill-extrusion-opacity':.9
            }
          },label?label.id:undefined);
        }catch(_){}
      });
    }

    function startFallbackDive(p){
      engineLabel.textContent='OPEN 3D';
      modeText.textContent='3D';
      status('Tamamen ücretsiz açık 3D harita');
      map.flyTo({center:[p.lng,p.lat],zoom:17.4,pitch:69,bearing:25,duration:3600,curve:1.5,speed:.8,essential:true});
      setTimeout(()=>busy=false,3600);
    }

    initFallback();
  </script>
</body>
</html>
