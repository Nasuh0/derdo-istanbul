name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-must-be-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-must-be-different-and-32-chars
      COOKIE_SECURE: "false"
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: ci-key
      LIVEKIT_API_SECRET: ci-livekit-secret-at-least-16-characters
      LIVEKIT_TOKEN_TTL_SECONDS: 300
      CLOUDINARY_CLOUD_NAME: ci-cloud
      CLOUDINARY_API_KEY: ci-key
      CLOUDINARY_API_SECRET: ci-secret
      MAX_IMAGE_UPLOAD_BYTES: 8388608
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build:api
      - run: pnpm build:web
