services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: derdo
      POSTGRES_USER: derdo
      POSTGRES_PASSWORD: derdo_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U derdo -d derdo"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - derdo_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - derdo_redis_data:/data

volumes:
  derdo_postgres_data:
  derdo_redis_data:
